"""Pool (our AMM has a single pool). id = AMM contract address"""
type Pool @entity(immutable: false) {
  id: Bytes!
  tokenA: Bytes! # Used to tell whether a Swap event's tokenIn is A or B
  tokenB: Bytes!
  reserveA: BigInt!
  reserveB: BigInt!
  totalLiquidity: BigInt! # Total LP supply
  swapCount: BigInt!
}

"""One row per swap. id = tx hash + log index"""
type Swap @entity(immutable: true) {
  id: Bytes!
  trader: Bytes!
  tokenIn: Bytes!
  amountIn: BigInt!
  amountOut: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

enum LiquidityType {
  ADD
  REMOVE
}

"""One row per liquidity add/remove. id = tx hash + log index"""
type LiquidityEvent @entity(immutable: true) {
  id: Bytes!
  type: LiquidityType!
  provider: Bytes!
  amountA: BigInt!
  amountB: BigInt!
  liquidity: BigInt!
  timestamp: BigInt!
}

enum ListingStatus {
  ACTIVE
  SOLD
  CANCELLED
}

"""A sale listing. id = listingId ("0", "1", …)"""
type Listing @entity(immutable: false) {
  id: ID!
  seller: Bytes!
  nft: Bytes!
  tokenId: BigInt!
  paymentToken: Bytes!
  price: BigInt!
  status: ListingStatus!
  buyer: Bytes # Set only once sold (null while active or cancelled)
  createdAt: BigInt!
}

"""A single NFT. id = tokenId ("0", "1", "2")"""
type Nft @entity(immutable: false) {
  id: ID!
  owner: Bytes!
}
