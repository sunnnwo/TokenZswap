specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: AMM
    network: chapel # The Graph's name for BSC testnet
    source:
      address: "0x0a1134046cECA785a218A92376fdb542cB9ACA52" # AMM address (deployment/97.json)
      abi: AMM
      startBlock: 138043275
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Pool, Swap, LiquidityEvent, Listing]
      abis:
        - name: AMM
          file: ./abis/AMM.json
      eventHandlers:
        - event: LiquidityAdded(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
        - event: Swap(indexed address,indexed address,uint256,uint256)
          handler: handleSwap
        - event: NFTListed(indexed uint256,indexed address,indexed address,uint256,address,uint256)
          handler: handleNFTListed
        - event: NFTListingCancelled(indexed uint256,indexed address)
          handler: handleNFTListingCancelled
        - event: NFTSold(indexed uint256,indexed address,indexed address,uint256)
          handler: handleNFTSold
      file: ./src/amm.ts
  - kind: ethereum/contract
    name: TokenizeArt
    network: chapel # Same as the AMM data source
    source:
      address: "0x7DA2B6BC5330ad801427E6879201b079A774aB15" # NFT address
      abi: TokenizeArt
      startBlock: 138043275 # Same as the AMM data source
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Nft]
      abis:
        - name: TokenizeArt
          file: ./abis/TokenizeArt.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256) # In ERC-721 the third value (tokenId) is also indexed
          handler: handleTransfer
      file: ./src/nft.ts
