# /etc/nginx/sites-available/tokenzswap  (enable with a symlink in sites-enabled/)
# /api/* goes to the cache server on 127.0.0.1:3001; everything else is the built frontend (frontend/dist).
server {
    listen 80;
    server_name _;

    root /var/www/tokenzswap;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
